name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job request a GitHub OIDC token to sign in to AWS

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # type-check
      - run: npm test        # Lambda unit tests + CDK stack assertions

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # A secret (not a variable) so GitHub hides the role ARN in logs; the repo is public.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true   # hide the AWS account ID anywhere it appears in the log
      - name: Deploy
        # Public logs: CDK prints the stack outputs (site URL, bucket and table names), so the
        # full output goes to a file. On failure, only the error lines are shown.
        run: |
          if ! npx cdk deploy CloudVideoPlatformStack --require-approval never > deploy.log 2>&1; then
            grep -iE "error|fail|❌" deploy.log | tail -40
            exit 1
          fi
          echo "Deploy succeeded (full output kept out of the public log)."
